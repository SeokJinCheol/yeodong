# Loaded by /usr/local/etc/nginx/nginx.conf inside its http block.
# Change the absolute paths when deploying to another machine.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location = /yeodong {
        return 301 /yeodong/$is_args$args;
    }

    location = /yeodong/api {
        return 308 /yeodong/api/$is_args$args;
    }

    location ^~ /yeodong/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location ^~ /yeodong/assets/ {
        alias /Users/seokjincheol/workspace/yeodong/frontend/dist/assets/;
    }

    location /yeodong/ {
        alias /Users/seokjincheol/workspace/yeodong/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /yeodong/index.html;
        add_header Cache-Control "no-cache";
    }

    # Add /rag/ locations here when ri-project is ready.
    location / {
        return 404;
    }
}
